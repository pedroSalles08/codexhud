name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore CodexHud.sln

      - name: Run tests
        run: dotnet test CodexHud.sln --configuration Release --no-restore --filter "TestCategory!=LocalIntegration"

      - name: Resolve package version
        id: package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}' -replace '^v', ''
          } else {
            '0.1.0'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The tag must use a semantic version such as v0.1.0. Received: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version '${{ steps.package.outputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodexHUD-Setup-x64
          path: artifacts/installer/CodexHUD-Setup-x64.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' `
            'artifacts/installer/CodexHUD-Setup-x64.exe#CodexHUD installer for Windows x64' `
            --title 'CodexHUD ${{ steps.package.outputs.version }}' `
            --generate-notes `
            --verify-tag
